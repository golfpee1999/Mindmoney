async function saveFile(name,blob){

/* ---------- CSV import (Google Sheet) ---------- */
function parseCSV(e){var t=[],r=[],a='',q=false;for(var o=0;o<e.length;o++){var c=e[o];if(c==='"'){if(q&&e[o+1]==='"'){a+='"';o++;}else q=!q;}else if(c===','&&!q){r.push(a.trim());a='';}else if(c==='\n'&&!q){r.push(a.trim());t.push(r);r=[];a='';}else if(c!=='\r'||q)a+=c;}if(q)throw Error(t('csvQuote'));if(a||r.length){r.push(a.trim());t.push(r);}return t;}
function importCSV(text){
  var rows=parseCSV(text.replace(/^\uFEFF/,'')),hi=rows.findIndex(function(c){return c.indexOf('ประเภท')>=0&&c.indexOf('จำนวนเงิน')>=0;});
  if(hi<0)throw Error(t('csvNoHeader'));
  var h=rows[hi];if(!['วันที่','ประเภท','หมวดหมู่','รายการ','จำนวนเงิน'].every(function(c){return h.indexOf(c)>=0;}))throw Error(t('csvMissingCols'));
  var g=function(r,k){return r[h.indexOf(k)]||'';};
  var items=rows.slice(hi+1).filter(function(r){return ['รายรับ','รายจ่าย'].indexOf(g(r,'ประเภท'))>=0;}).map(function(r){
    var type=g(r,'ประเภท')==='รายรับ'?'income':'expense',n=Number(g(r,'จำนวนเงิน').replace(/,/g,''));if(!isFinite(n)||n<0)throw Error(t('csvBadAmt'));
    var paid=/^(true|ใช่|จ่ายแล้ว)$/i.test(g(r,'จ่ายจริงแล้ว?')),x=g(r,'วันที่'),d='';
    if(/^\d{4}-\d{2}-\d{2}/.test(x))d=x.slice(0,10);else{var m=x.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)d=(+m[3]>2400?+m[3]-543:m[3])+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d))throw Error(t('csvBadDate'));
    return {id:uid(),month:d.slice(0,7),date:d,type:type,category:g(r,'หมวดหมู่')||'อื่นๆ',title:g(r,'รายการ')||'รายการ',plannedAmount:n,actualAmount:type==='expense'&&paid?n:0,status:type==='expense'&&paid?'paid':'planned',note:g(r,'หมายเหตุ')};});
  if(!items.length)throw Error(t('csvNoRows'));
  var key=function(t){return JSON.stringify([t.date,t.month,t.type,t.category,t.title.trim().toLowerCase(),t.plannedAmount]);},cnt=new Map();
  S.transactions.forEach(function(t){cnt.set(key(t),(cnt.get(key(t))||0)+1);});
  var skip=0,add=items.filter(function(t){var k=key(t),n=cnt.get(k)||0;if(n){cnt.set(k,n-1);skip++;return false;}return true;});
  add.forEach(function(t){if(S.categories.indexOf(t.category)<0)S.categories.push(t.category);});
  S.transactions=S.transactions.concat(add);return {added:add.length,skipped:skip};
}

</script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script>(function(){
'use strict';
var CFG=window.FIREBASE_CONFIG||{};

  if(!t){t=document.createElement('div');t.id='gs-toast';document.body.appendChild(t);}

window.__golfToast=toast;

/* ---------- write hook ---------- */

    clearTimeout(timers[k]);timers[k]=setTimeout(function(){push(k);},1500);}}catch(e){}
};
function ref(k){return db.doc('users/'+uid+'/sync/'+KEYS[k]);}
async function push(k){
  if(!db||!uid)return;
  if(pushing[k]){pushing[k]='again';return;}
  pushing[k]=true;setSync('saving');
  try{var raw=ls.getItem(k);
    if(raw!=null){var m=getMeta(),stamp=(m[k]&&m[k].dirtyAt)||Date.now(),parts=[];
      for(var i=0;i<raw.length;i+=CHUNK)parts.push(raw.slice(i,i+CHUNK));
      var r=ref(k);
      for(var j=0;j<parts.length;j++)await r.collection('chunks').doc(String(j)).set({stamp:stamp,text:parts[j]});
      await r.set({stamp:stamp,chunks:parts.length,length:raw.length,device:deviceId()});
      m=getMeta();m[k]=m[k]||{};m[k].syncedAt=stamp;if(m[k].dirtyAt===stamp)m[k].dirty=false;putMeta(m);}

  }catch(e){console.warn('push',e);setSync(navigator.onLine===false?'offline':'error');}

function deviceId(){var m=getMeta();if(!m.device){m.device=Math.random().toString(36).slice(2);putMeta(m);}return m.device;}

  var r=ref(k),snap=await r.get();if(!snap.exists)return null;
  var meta=snap.data(),reqs=[];for(var j=0;j<(meta.chunks|0);j++)reqs.push(r.collection('chunks').doc(String(j)).get());
  var got=await Promise.all(reqs),texts=[];
  for(var q=0;q<got.length;q++){var d=got[q].exists&&got[q].data();if(!d||d.stamp!==meta.stamp)return 'torn';texts.push(d.text);}
  var raw=texts.join('');return raw.length===meta.length?{meta:meta,raw:raw}:'torn';
}
function applyRemote(k,r){origSet.call(ls,k,r.raw);var m=getMeta();m[k]={syncedAt:r.meta.stamp,dirtyAt:r.meta.stamp,dirty:false};putMeta(m);}
function clearLocal(){Object.keys(KEYS).concat([META,OWNER]).forEach(function(k){try{ls.removeItem(k);}catch(e){}});}

/* ---------- start the app once data is ready ---------- */
function startApp(){
  if(started)return;started=true;
  document.getElementById('auth').hidden=true;root.setAttribute('data-ready','1');
  var src=document.getElementById('app-bundle'),s=document.createElement('script');
  s.textContent=src.textContent;document.body.appendChild(s);
}
async function afterLogin(user){
  if(loggingIn||started)return;loggingIn=true;
  uid=user.uid;window.__userName=user.displayName||pendingName||(user.email||'').split('@')[0];window.__userEmail=user.email;
  showAuth('loading');
  if(ls.getItem(OWNER)!==uid){clearLocal();origSet.call(ls,OWNER,uid);}
  var toPush=[];
  try{
    for(var k of Object.keys(KEYS)){
      var r=await pull(k);if(r==='torn')r=await pull(k);if(r==='torn')continue;
      var m=getMeta(),mk=m[k]||{},local=ls.getItem(k);
      if(!r){if(local!=null)toPush.push(k);continue;}
      if(local===r.raw){applyRemote(k,r);continue;}
      if(local!=null&&mk.dirty&&(mk.dirtyAt||0)>r.meta.stamp){toPush.push(k);continue;}
      applyRemote(k,r);
    }
    setSync('ok');
  }catch(e){
    console.warn('pull',e);
    if(ls.getItem(FKEY)==null&&!getMeta().everLoaded){loggingIn=false;showAuth('login','โหลดข้อมูลไม่สำเร็จ กรุณาตรวจอินเทอร์เน็ตแล้วลองใหม่');return;}
    setSync('offline');
  }
  var mm=getMeta();mm.everLoaded=true;putMeta(mm);
  initializing=false;toPush.forEach(push);
  Object.keys(KEYS).forEach(function(k){
    ref(k).onSnapshot(function(snap){
      if(!snap.exists||snap.metadata.hasPendingWrites)return;
      var d=snap.data(),mk=getMeta()[k]||{};
      if(d.device===deviceId()||d.stamp===mk.syncedAt||d.stamp<(mk.syncedAt||0))return;
      if(k===FKEY)toast('มีข้อมูลใหม่จากอีกเครื่อง','โหลดข้อมูลล่าสุด',async function(){var r=await pull(k);if(r&&r!=='torn'){applyRemote(k,r);location.reload();}});
      else if(!mk.dirty)pull(k).then(function(r){if(r&&r!=='torn'){applyRemote(k,r);window.dispatchEvent(new CustomEvent('golf-sync-applied',{detail:k}));}});
    },function(){});
  });
  startApp();
}
window.__logout=function(){
  if(!confirm(al('logoutConfirm')))return;
  var go=function(){clearLocal();location.reload();};
  var pend=Object.keys(KEYS).filter(function(k){return (getMeta()[k]||{}).dirty;});
  Promise.all(pend.map(push)).finally(function(){auth.signOut().then(go,go);});
};
window.addEventListener('online',function(){Object.keys(KEYS).forEach(function(k){if((getMeta()[k]||{}).dirty)push(k);});});

/* ---------- auth screen ---------- */
var box=document.getElementById('auth'),mode='login';
function authLang(){try{return JSON.parse(localStorage.getItem('golf-finance-html-v1')).state.settings.lang;}catch(e){return (navigator.language||'th').toLowerCase().indexOf('th')===0?'th':'en';}}
var AL={th:{login:'เข้าสู่ระบบ',signup:'สมัครใช้งาน',email:'อีเมล',pw:'รหัสผ่าน',pw2:'ยืนยันรหัสผ่าน',name:'ชื่อที่ให้แอปเรียก',namePh:'เช่น กอล์ฟ',signupBtn:'สมัครและเริ่มใช้งาน',resetBtn:'ส่งลิงก์ตั้งรหัสใหม่',loginBtn:'เข้าสู่ระบบ',forgot:'ลืมรหัสผ่าน?',back:'← กลับไปเข้าสู่ระบบ',resetNote:'ใส่อีเมลที่สมัครไว้ ระบบจะส่งลิงก์ตั้งรหัสผ่านใหม่ไปให้',resetOk:'ส่งลิงก์แล้ว กรุณาเช็กอีเมล (รวมถึงโฟลเดอร์สแปม)',pwMismatch:'รหัสผ่านสองช่องไม่ตรงกัน',tag:'รู้ทันเงิน วางแผนปลดหนี้ เก็บเงินถึงเป้า',loading:'กำลังโหลด…',noconfig:'ยังไม่ได้ตั้งค่า Firebase ในไฟล์นี้ (FIREBASE_CONFIG)',netfail:'โหลดระบบล็อกอินไม่ได้ กรุณาตรวจอินเทอร์เน็ตแล้วรีเฟรช',logoutConfirm:'ออกจากระบบ Mindmoney? ข้อมูลจะถูกลบออกจากเครื่องนี้ แต่ยังอยู่ในบัญชีของคุณ'},
 en:{login:'Log in',signup:'Sign up',email:'Email',pw:'Password',pw2:'Confirm password',name:'What should the app call you?',namePh:'e.g. Golf',signupBtn:'Sign up & start',resetBtn:'Send reset link',loginBtn:'Log in',forgot:'Forgot password?',back:'\u2190 Back to log in',resetNote:"Enter the email you signed up with and we'll send a reset link.",resetOk:'Link sent \u2014 check your email (including spam).',pwMismatch:"Passwords don't match",tag:'Know your money. Plan your payoff. Reach your goals.',loading:'Loading\u2026',noconfig:'Firebase is not configured in this file (FIREBASE_CONFIG)',netfail:"Couldn't load sign-in. Check your connection and refresh.",logoutConfirm:'Log out of Mindmoney? Data will be removed from this device, but stays in your account.'}};
function al(k){return AL[authLang()][k]||AL.th[k];}
document.querySelector('.auth-tag').textContent=al('tag');
var ERR_TH={'auth/email-already-in-use':'อีเมลนี้สมัครไว้แล้ว ลองเข้าสู่ระบบแทน','auth/invalid-email':'รูปแบบอีเมลไม่ถูกต้อง','auth/weak-password':'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร',
  'auth/invalid-credential':'อีเมลหรือรหัสผ่านไม่ถูกต้อง','auth/wrong-password':'อีเมลหรือรหัสผ่านไม่ถูกต้อง','auth/user-not-found':'ไม่พบบัญชีนี้ ลองสมัครใช้งาน',
  'auth/invalid-login-credentials':'อีเมลหรือรหัสผ่านไม่ถูกต้อง','auth/too-many-requests':'ลองผิดหลายครั้งเกินไป กรุณารอสักครู่','auth/network-request-failed':'เชื่อมต่ออินเทอร์เน็ตไม่ได้',

function showAuth(m,err){
  mode=m;box.hidden=false;var f=box.querySelector('.auth-body');
  if(m==='loading'){f.innerHTML='<p class="auth-wait">'+al('loading')+'</p>';return;}
  if(m==='noconfig'){f.innerHTML='<p class="auth-err">'+al('noconfig')+'</p>';return;}

box.addEventListener('submit',async function(e){
  e.preventDefault();var fm=e.target,v=function(n){var x=fm.querySelector('[name='+n+']');return x?x.value.trim():'';},er=fm.querySelector('.auth-err'),btn=fm.querySelector('.auth-main');
  var email=v('email'),pw=fm.querySelector('[name=pw]')?fm.querySelector('[name=pw]').value:'';
  er.textContent='';
  if(mode==='signup'&&pw!==fm.querySelector('[name=pw2]').value){er.textContent=al('pwMismatch');return;}
  btn.disabled=true;
  try{
    if(mode==='reset'){await auth.sendPasswordResetEmail(email);er.className='auth-ok';er.textContent=al('resetOk');btn.disabled=false;return;}
