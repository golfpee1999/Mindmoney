async function saveFile(name,blob){
  if(window.claude&&window.claude.use){try{var dl=await window.claude.use('downloads');if(dl){try{var r=await dl.save({filename:name,data:blob});if(r&&r.status==='saved')toast('บันทึกไฟล์แล้ว');}catch(e){if(!e||e.code!=='declined')toast('บันทึกไฟล์ไม่ได้ในหน้านี้');}return;}}catch(e){}}
  var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},15000);
}

/* ---------- CSV import (Google Sheet) ---------- */
function parseCSV(e){var t=[],r=[],a='',q=false;for(var o=0;o<e.length;o++){var c=e[o];if(c==='"'){if(q&&e[o+1]==='"'){a+='"';o++;}else q=!q;}else if(c===','&&!q){r.push(a.trim());a='';}else if(c==='\n'&&!q){r.push(a.trim());t.push(r);r=[];a='';}else if(c!=='\r'||q)a+=c;}if(q)throw Error('เครื่องหมายคำพูดใน CSV ไม่ครบ');if(a||r.length){r.push(a.trim());t.push(r);}return t;}
function importCSV(text){
  var rows=parseCSV(text.replace(/^\uFEFF/,'')),hi=rows.findIndex(function(c){return c.indexOf('ประเภท')>=0&&c.indexOf('จำนวนเงิน')>=0;});
  if(hi<0)throw Error('ไม่พบหัวตาราง (ต้องมีคอลัมน์ ประเภท และ จำนวนเงิน)');
  var h=rows[hi];if(!['วันที่','ประเภท','หมวดหมู่','รายการ','จำนวนเงิน'].every(function(c){return h.indexOf(c)>=0;}))throw Error('คอลัมน์ CSV ไม่ครบ ต้องมี วันที่ ประเภท หมวดหมู่ รายการ จำนวนเงิน');
  var g=function(r,k){return r[h.indexOf(k)]||'';};
  var items=rows.slice(hi+1).filter(function(r){return ['รายรับ','รายจ่าย'].indexOf(g(r,'ประเภท'))>=0;}).map(function(r){
    var type=g(r,'ประเภท')==='รายรับ'?'income':'expense',n=Number(g(r,'จำนวนเงิน').replace(/,/g,''));if(!isFinite(n)||n<0)throw Error('จำนวนเงินไม่ถูกต้อง');
    var paid=/^(true|ใช่|จ่ายแล้ว)$/i.test(g(r,'จ่ายจริงแล้ว?')),x=g(r,'วันที่'),d='';
    if(/^\d{4}-\d{2}-\d{2}/.test(x))d=x.slice(0,10);else{var m=x.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)d=(+m[3]>2400?+m[3]-543:m[3])+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d))throw Error('วันที่ไม่ถูกต้อง ใช้ YYYY-MM-DD หรือ วัน/เดือน/ปี');
    return {id:uid(),month:d.slice(0,7),date:d,type:type,category:g(r,'หมวดหมู่')||'อื่นๆ',title:g(r,'รายการ')||'รายการ',plannedAmount:n,actualAmount:type==='expense'&&paid?n:0,status:type==='expense'&&paid?'paid':'planned',note:g(r,'หมายเหตุ')};});
  if(!items.length)throw Error('ไม่พบรายการ');
  var key=function(t){return JSON.stringify([t.date,t.month,t.type,t.category,t.title.trim().toLowerCase(),t.plannedAmount]);},cnt=new Map();
  S.transactions.forEach(function(t){cnt.set(key(t),(cnt.get(key(t))||0)+1);});
  var skip=0,add=items.filter(function(t){var k=key(t),n=cnt.get(k)||0;if(n){cnt.set(k,n-1);skip++;return false;}return true;});
  add.forEach(function(t){if(S.categories.indexOf(t.category)<0)S.categories.push(t.category);});
  S.transactions=S.transactions.concat(add);return {added:add.length,skipped:skip};
}
function validState(s){return s&&Array.isArray(s.transactions)&&Array.isArray(s.templates)&&Array.isArray(s.categories)&&typeof s.plans==='object'&&s.settings&&s.transactions.every(function(t){return t.id&&/^\d{4}-\d{2}$/.test(t.month)&&(t.type==='income'||t.type==='expense')&&typeof t.plannedAmount==='number';});}

function saveDraft(){
  var t=D.t,amt=num(D.amt);
  if(!amt){toast('ใส่จำนวนเงินก่อน');return;}
  t.plannedAmount=amt;t.title=(t.title||'').trim()||t.category||'รายการ';
  if(t.date&&t.date.slice(0,7)!==t.month)t.month=t.date.slice(0,7);
  if(!/^\d{4}-\d{2}$/.test(t.month))t.month=ui.month;
  if(isDone(t))t.actualAmount=t.actualAmount&&t.actualAmount!==t.plannedAmount&&!D.isNew?t.actualAmount:t.plannedAmount;
  if(t.status==='partial'){t.actualAmount=Math.min(num(t.actualAmount),amt);if(!t.actualAmount)t.status='planned';}
  if(t.status==='planned')t.actualAmount=0;
  if(S.categories.indexOf(t.category)<0)S.categories.push(t.category);
  if(D.rec){var tp=t.recurringTemplateId&&S.templates.find(function(x){return x.id===t.recurringTemplateId;});
    if(tp)Object.assign(tp,{title:t.title,category:t.category,type:t.type,defaultAmount:amt,active:true});
    else{var id=uid();S.templates.push({id:id,type:t.type,category:t.category,title:t.title,defaultAmount:amt,active:true});t.recurringTemplateId=id;}}
  else if(t.recurringTemplateId){var tp2=S.templates.find(function(x){return x.id===t.recurringTemplateId;});if(tp2)tp2.active=false;}
  var i=S.transactions.findIndex(function(x){return x.id===t.id;});if(i>=0)S.transactions[i]=t;else S.transactions.push(t);
  var wasNew=D.isNew;ui.month=t.month;closeSheet();commit(wasNew?'เพิ่ม '+t.title+' แล้ว':'บันทึกแล้ว');
}
function sheetClick(b){
  var a=b.dataset.s,v=b.dataset.v,t=D&&D.t;
  if(a==='close'){closeSheet();return;}
  if(a==='type'){t.type=v;var c=catsFor(v);t.category=c[0]||(v==='income'?'รายรับอื่น':'อื่นๆ');if(t.status==='paid'&&v==='income')t.status='received';if(t.status==='received'&&v==='expense')t.status='paid';drawType();drawBody();}
  else if(a==='cat'){t.category=v;drawBody();}
  else if(a==='newcat'){var n=prompt('ชื่อหมวดใหม่');if(n&&n.trim()){n=n.trim().slice(0,60);if(S.categories.indexOf(n)<0){S.categories.push(n);if(t.type==='income')INCOME_CATS.push(n);}t.category=n;drawBody();}}
  else if(a==='status'){t.status=v==='done'?(t.type==='income'?'received':'paid'):v;drawBody();}
  else if(a==='note'){D.showNote=true;drawBody();}
  else if(a==='key'){var d=D.amt;if(v==='del')d=d.slice(0,-1);else if(v==='.'){if(d.indexOf('.')<0)d=(d||'0')+'.';}else{var p=d.split('.');if(p[1]&&p[1].length>=2)return;if(d.length<10)d=d==='0'?v:d+v;}D.amt=d;drawAmt();if(navigator.vibrate)navigator.vibrate(8);}
  else if(a==='save')saveDraft();
  else if(a==='dup'){var c2=Object.assign({},t,{id:uid(),status:'planned',actualAmount:0});delete c2.recurringTemplateId;S.transactions.push(c2);closeSheet();commit('ทำซ้ำรายการแล้ว');}
  else if(a==='del'){if(!confirm('ลบรายการ "'+t.title+'"?'))return;var removed=S.transactions.find(function(x){return x.id===t.id;}),idx=S.transactions.indexOf(removed);S.transactions=S.transactions.filter(function(x){return x.id!==t.id;});closeSheet();commit();
    toast('ลบรายการแล้ว','เลิกทำ',function(){S.transactions.splice(idx,0,removed);commit('กู้คืนแล้ว');});}
}
function sheetInput(el){var f=el.dataset.d,t=D.t;if(!f)return;

  else t[f]=el.value;}

    for(var m=1;m<=12;m++){var ym=y+'-'+String(m).padStart(2,'0'),has=S.transactions.some(function(t){return t.month===ym;});h+='<button class="'+(ym===ui.month?'on ':'')+(ym===cur?'now':'')+'" data-m="pick" data-v="'+ym+'">'+thMonthOnly(m)+(has?' •':'')+'</button>';}

function onClick(e){
  if(D&&sheetEl.contains(e.target)){var sb=e.target.closest('[data-s]');if(sb){e.preventDefault();sheetClick(sb);}else if(e.target.classList.contains('sheet'))closeSheet();return;}
  var b=e.target.closest('[data-a]');if(!b||!app.contains(b))return;var a=b.dataset.a,v=b.dataset.v,t;
  switch(a){

    case 'add':openEdit();break;

      S.transactions=S.transactions.filter(function(x){return x.month!==ui.month;}).concat(sc);ui.scenario=null;commit('บันทึกเป็นแผนแล้ว');break;
